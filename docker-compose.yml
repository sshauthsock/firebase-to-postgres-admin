services:
  postgres:
    image: postgres:16
    container_name: bayeon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

  api:
    build: .
    container_name: bayeon_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "127.0.0.1:8000:8000"
  migrator:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/keys/serviceAccountKey.json
    volumes:
      - .:/app
      - /home/dklim/.secrets/firebase/serviceAccountKey.json:/run/keys/serviceAccountKey.json:ro
    command: ["python", "-m", "app.migrations.run"]
    restart: "no"

volumes:
  pgdata: